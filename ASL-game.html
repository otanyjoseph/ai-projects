<!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>ASL Game - Tany (Community)</title>
      <meta name="description" content="Learn American Sign Language (ASL) through interactive quizzes with real-time gesture recognition, providing accurate sign detection, instant feedback, and an accessible learning experience for users." />
      <meta name="robots" content="noindex, nofollow" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      
      <style>
#camFallbackOverlay{position:fixed;inset:0;z-index:999999;display:none;align-items:center;justify-content:center;background:rgba(16,20,38,.92);backdrop-filter:blur(6px);font-family:monospace}
#camFallbackOverlay.show{display:flex}
.cam-fallback-box{text-align:center;padding:32px 40px;max-width:520px;margin:24px;background:#000;border:6px solid #f8f8f8;box-shadow:inset -4px -4px 0 #555,inset 4px 4px 0 #fff,10px 10px 0 rgba(0,0,0,.5)}
.cam-fallback-title{font-size:28px;letter-spacing:4px;color:#ff8a65;margin-bottom:10px;text-shadow:3px 3px 0 #ff4d4f,5px 5px 0 #8a1000;font-weight:900;text-transform:uppercase}
.cam-fallback-sub{font-size:10px;letter-spacing:2px;color:#22c55e;margin-bottom:20px}
.cam-fallback-warn{font-size:9px;letter-spacing:2px;color:#fc7460;margin-bottom:8px}
.cam-fallback-msg{font-size:8px;letter-spacing:1px;color:#9aa3bd;line-height:2.2;margin-bottom:24px}
.cam-fallback-btn{display:inline-flex;align-items:center;gap:10px;padding:16px 28px;background:linear-gradient(100deg,#ff9a6b 0%,#ff6a52 55%,#ff4d4f 100%);color:#fff;font-family:monospace;font-size:11px;font-weight:bold;letter-spacing:3px;text-transform:uppercase;text-decoration:none;box-shadow:0 5px 0 #b03030,5px 5px 0 rgba(0,0,0,.5);transition:transform .1s}
.cam-fallback-btn:hover{transform:translateY(3px);box-shadow:0 2px 0 #b03030,2px 2px 0 rgba(0,0,0,.5)}
.cam-fallback-note{font-size:8px;letter-spacing:2px;color:#4a7a00;margin-top:12px}
</style>
<div id="camFallbackOverlay">
  <div class="cam-fallback-box">
    <div class="cam-fallback-title">SIGNQUEST</div>
    <div class="cam-fallback-sub">LEARN ASL THROUGH PLAY</div>
    <div style="border-top:2px solid #333;margin-bottom:20px;"></div>
    <div class="cam-fallback-warn">&#9888; CAMERA ACCESS BLOCKED</div>
    <div class="cam-fallback-msg">This game requires camera access for hand tracking.<br>Embedded frames often block it by default.</div>
    <a id="camFallbackLink" class="cam-fallback-btn" href="#" target="_blank" rel="noopener">&#127918; OPEN FULL EXPERIENCE &#8594;</a>
    <div class="cam-fallback-note">OPENS IN NEW TAB</div>
  </div>
</div>
<script>
(function(){
  var link = document.getElementById('camFallbackLink');
  if (link) { try { link.href = window.location.href; } catch(e){} }

  function showFallback(){
    var el = document.getElementById('camFallbackOverlay');
    if (el) el.classList.add('show');
  }

  var md = navigator.mediaDevices;
  var origGUM = md && md.getUserMedia;

  if (md && origGUM) {
    md.getUserMedia = function(constraints){
      return origGUM.call(md, constraints).catch(function(err){
        console.error('Camera error:', err);
        showFallback();
        throw err;
      });
    };
  } else {
    showFallback();
  }
})();
</script>
